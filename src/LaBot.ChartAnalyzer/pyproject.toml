[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labot-chart-analyzer"
version = "0.1.0"
description = "Crypto Chart Analyzer for LaBot - AI-powered technical analysis service"
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
